[project]
name = "cloudphonebook-desktop"
version = "0.1.0"
description = "Modern PySide6 Desktop GUI for CloudPhoneBook"
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "cloudphonebook-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/shared"]
