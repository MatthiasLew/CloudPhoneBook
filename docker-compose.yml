services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudphonebook_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cloudphonebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: cloudphonebook_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/cloudphonebook
      JWT_SECRET_KEY: dev-cloudphonebook-super-secret-jwt-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app
      - ./packages/shared/shared:/app/packages/shared/shared

volumes:
  postgres_data:
